name: Backend dependency audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore backend
        run: dotnet restore media-vault-app.slnx

      - name: Check advisory baseline
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/check-dependency-advisories.ps1
